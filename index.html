<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rogue-like Engine</title>
  <meta name="description" content="A browser-based traditional roguelike engine featuring Turn-Based and RTwP modes, built with TypeScript and ROT.js." />
  <meta property="og:title" content="Rogue-like Engine" />
  <meta property="og:description" content="A browser-based traditional roguelike engine featuring Turn-Based and RTwP modes, built with TypeScript and ROT.js." />
  <!-- Google Fonts: Cinzel for carved headers, Plus Jakarta Sans for readable prose, JetBrains Mono for tactical telemetry & logs -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=JetBrains+Mono:ital,wght@0,400..800;1,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="app">
    <div class="layout-wrapper" id="game-layout">
      <main class="game-container">
        <div id="game-canvas-wrapper" class="canvas-wrapper">
          <!-- ROT.js Canvas2D display and tactical overlays mount here -->
          <div id="effects-overlay" class="effects-overlay"></div>
        </div>
      </main>
    </div>

    <!-- Unified Preact UI Shell (Sibling of #game-canvas-wrapper) -->
    <div id="ui-root" class="ui-root"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
